<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CrepLab LDN — CRM</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#080808;--surface:#111111;--surface2:#1a1a1a;--border:#ffffff10;--border2:#ffffff1a;
    --text:#f5f5f5;--muted:#666;--accent:#e8ff00;--accent2:#c8dc00;
    --green:#22c77a;--red:#f44;--amber:#f0a030;--white:#fff;
    --font:'DM Sans',sans-serif;--mono:'DM Mono',monospace;
  }
  html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.5}
  .app{display:flex;flex-direction:column;height:100vh;overflow:hidden}

  /* TOPBAR */
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:52px;border-bottom:1px solid var(--border);background:var(--surface);flex-shrink:0}
  .logo{display:flex;align-items:center;gap:10px}
  .logo-text{font-size:15px;font-weight:600;letter-spacing:.5px}
  .logo-text span{color:var(--accent)}
  .tabs{display:flex;gap:2px}
  .tab{padding:6px 14px;font-size:12px;font-weight:500;cursor:pointer;border:none;background:none;color:var(--muted);border-radius:6px;transition:all .15s;font-family:var(--font)}
  .tab:hover{color:var(--text);background:#ffffff08}
  .tab.on{color:var(--bg);background:var(--accent);font-weight:600}
  .main{flex:1;overflow-y:auto;padding:20px}
  .pg{display:none}.pg.on{display:block}

  /* KPIS */
  .kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
  .kpi-row-3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
  .kpi{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px}
  .kpi.accent{background:#e8ff0012;border-color:#e8ff0030}
  .kpi-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px;font-weight:500}
  .kpi-val{font-size:24px;font-weight:600;line-height:1;letter-spacing:-.5px}
  .kpi-sub{font-size:11px;color:var(--muted);margin-top:5px}
  .kpi-val.lime{color:var(--accent)}.kpi-val.green{color:var(--green)}.kpi-val.amber{color:var(--amber)}.kpi-val.red{color:var(--red)}

  /* CARDS */
  .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-bottom:14px}
  .card-title{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:12px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}

  /* TABLE */
  .tbl-wrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th{text-align:left;padding:8px 10px;font-size:10px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--border);white-space:nowrap;text-transform:uppercase;letter-spacing:.4px}
  td{padding:8px 10px;border-bottom:1px solid var(--border);color:var(--text);vertical-align:middle}
  tr:last-child td{border-bottom:none}
  tr.dr:hover td{background:#ffffff04}
  .tot-row td{background:#1a1a1a;font-weight:600}
  .mo-hdr td{background:#111;font-size:10px;font-weight:600;color:var(--accent);letter-spacing:.4px;padding:5px 10px;border-top:1px solid var(--border)}

  /* BADGES */
  .badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:500;white-space:nowrap;font-family:var(--mono)}
  .b-premium{background:#1a1a00;color:#e8ff00;border:1px solid #e8ff0030}
  .b-luxury{background:#001a2a;color:#5b8cf8;border:1px solid #3b6cf430}
  .b-ultimate{background:#1a0a00;color:#f0a030;border:1px solid #f0a03030}
  .b-sole{background:#0a1a0a;color:#22c77a;border:1px solid #22c77a30}
  .b-done{background:#0d2e1a;color:#22c77a;border:1px solid #22c77a30}
  .b-inprog{background:#2a1a00;color:#f0a030;border:1px solid #f0a03030}
  .b-collected{background:#0d2e1a;color:#22c77a;border:1px solid #22c77a30}
  .b-pending{background:#2a0d0d;color:#f06060;border:1px solid #f4444430}

  /* FORM */
  .form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:12px}
  .form-grid label{font-size:10px;color:var(--muted);display:block;margin-bottom:3px;font-weight:500;text-transform:uppercase;letter-spacing:.4px}
  .form-grid input,.form-grid select,.form-grid textarea{width:100%;padding:8px 10px;font-size:12px;background:var(--surface2);border:1px solid var(--border2);border-radius:7px;color:var(--text);font-family:var(--font);outline:none}
  .form-grid input:focus,.form-grid select:focus{border-color:var(--accent)}
  .form-grid select option{background:#1a1a1a}
  .btn{padding:8px 16px;font-size:12px;font-weight:600;border:1px solid var(--border2);border-radius:7px;cursor:pointer;background:none;color:var(--text);font-family:var(--font)}
  .btn-primary{background:var(--accent);color:#000;border-color:var(--accent)}
  .btn-primary:hover{background:var(--accent2)}
  .btn-xs{padding:3px 7px;font-size:10px;border:1px solid var(--border);border-radius:4px;cursor:pointer;background:none;color:var(--muted);font-family:var(--font)}
  .btn-xs:hover{border-color:#f06060;color:#f06060}
  .btn-sm{padding:5px 10px;font-size:11px;border:1px solid var(--border);border-radius:5px;cursor:pointer;background:none;color:var(--muted);font-family:var(--font)}
  .btn-sm:hover{background:#ffffff08;color:var(--text)}

  /* BAR */
  .bar-row{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .bar-lbl{font-size:10px;color:var(--muted);width:90px;text-align:right;flex-shrink:0}
  .bar-outer{flex:1;background:var(--surface2);border-radius:3px;height:14px;overflow:hidden}
  .bar-inner{height:100%;border-radius:3px}
  .bar-lime{background:var(--accent)}.bar-green{background:var(--green)}.bar-amber{background:var(--amber)}.bar-blue{background:#3b6cf4}
  .bar-val{font-size:10px;font-family:var(--mono);width:40px;text-align:right}

  /* INSIGHT */
  .insight{font-size:12px;color:var(--muted);padding:9px 12px;border-left:2px solid var(--accent);margin-bottom:7px;line-height:1.6;border-radius:0 6px 6px 0;background:#e8ff0005}
  .insight strong{color:var(--text)}
  .insight.warn{border-left-color:var(--amber);background:#f0a03005}
  .insight.good{border-left-color:var(--green);background:#22c77a05}
  .insight.bad{border-left-color:var(--red);background:#f4444405}

  /* MONTHLY REPORT */
  .mo-report{background:var(--surface);border:1px solid var(--border);border-radius:12px;margin-bottom:14px;overflow:hidden}
  .mo-report-hdr{background:#111;border-bottom:1px solid #e8ff0020;padding:14px 18px;display:flex;justify-content:space-between;align-items:center}
  .mo-report-title{font-size:14px;font-weight:600}
  .mo-report-stats{display:flex;gap:20px}
  .mo-stat{text-align:right}
  .mo-stat-val{font-size:14px;font-weight:600;font-family:var(--mono)}
  .mo-stat-lbl{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
  .mo-report-body{padding:16px 18px}

  /* SERVICE PILLS */
  .svc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
  .svc-pill{border-radius:8px;padding:10px 12px;text-align:center;cursor:pointer;border:1px solid var(--border);background:var(--surface2);transition:all .15s}
  .svc-pill:hover{border-color:var(--accent)}
  .svc-pill.selected{background:#e8ff0015;border-color:var(--accent)}
  .svc-name{font-size:11px;font-weight:600}
  .svc-price{font-size:13px;font-weight:600;color:var(--accent);font-family:var(--mono)}

  .filter-row{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
  .filter-row input,.filter-row select{padding:6px 10px;font-size:11px;background:var(--surface2);border:1px solid var(--border2);border-radius:7px;color:var(--text);font-family:var(--font);outline:none}

  .target-bar{background:var(--surface2);border-radius:6px;height:20px;overflow:hidden;margin-top:6px;position:relative}
  .target-fill{height:100%;border-radius:6px;background:var(--accent);transition:width .5s ease}
  .target-label{position:absolute;top:50%;right:8px;transform:translateY(-50%);font-size:10px;font-family:var(--mono);font-weight:600;color:#000;mix-blend-mode:difference}

  ::-webkit-scrollbar{width:5px;height:5px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
</style>
</head>

      <button class="tab" onclick="goTab('monthly')">Monthly</button>
      <button class="tab" onclick="goTab('report')">Monthly report</button>
    </div>
    <div style="font-size:10px;color:var(--muted);font-family:var(--mono)" id="topbar-stats"></div>
  </div>
  <div class="main">
    <div id="pg-dash" class="pg on"></div>
    <div id="pg-jobs" class="pg"></div>
    <div id="pg-monthly" class="pg"></div>
    <div id="pg-report" class="pg"></div>
  </div>
</div>

let DATA=JSON.parse(localStorage.getItem(KEY)||'null');
if(!DATA){DATA=SEED_DATA;localStorage.setItem(KEY,JSON.stringify(DATA));}
let TARGETS=JSON.parse(localStorage.getItem(KEY+'_targets')||'{}');

function save(){localStorage.setItem(KEY,JSON.stringify(DATA));localStorage.setItem(KEY+'_targets',JSON.stringify(TARGETS));}
function parseD(s){const[d,m,y]=s.split('/');return new Date(+y,+m-1,+d);}
function fmtD(s){try{return parseD(s).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'2-digit'});}catch{return s;}}
function moKey(s){return parseD(s).toLocaleDateString('en-GB',{month:'long',year:'numeric'});}
function moOrd(s){const d=parseD(s);return d.getFullYear()*100+d.getMonth();}
function todayStr(){const d=new Date();return[String(d.getDate()).padStart(2,'0'),String(d.getMonth()+1).padStart(2,'0'),d.getFullYear()].join('/');}
function thisMonthKey(){return new Date().toLocaleDateString('en-GB',{month:'long',year:'numeric'});}
function svcById(id){return SERVICES.find(s=>s.id===id)||{name:id,price:0,color:'',desc:''};}

function getMonthGroups(){
  const mm={};
  DATA.forEach(function(j){
    try{const k=moKey(j.date),o=moOrd(j.date);if(!mm[k])mm[k]={ord:o,jobs:[]};mm[k].jobs.push(j);}catch(e){}
  });
  return Object.values(mm).sort(function(a,b){return a.ord-b.ord;});
}

function calcMonth(jobs){
  const pairs=jobs.reduce(function(a,j){return a+(+j.qty||1);},0);
  const rev=jobs.reduce(function(a,j){return a+(+j.total||0);},0);
  const svcCount={};
  jobs.forEach(function(j){svcCount[j.service]=(svcCount[j.service]||0)+(+j.qty||1);});
  return{pairs,rev,collected:rev,pending:0,jobs:jobs.length,svcCount};
}

function goTab(id){
  document.querySelectorAll('.tab').forEach(function(el,i){el.classList.toggle('on',['dash','jobs','monthly','report'][i]===id);});
  document.querySelectorAll('.pg').forEach(function(el){el.classList.toggle('on',el.id==='pg-'+id);});
  render(id);
}

function render(tab){
  if(tab==='dash')renderDash();

  else if(tab==='report')renderReport();
  updateTopbar();
}

  html+='<div class="kpi-sub">£'+tm.rev.toLocaleString()+' revenue</div></div>';

    html+='<div class="bar-row"><span class="bar-lbl">'+mo.jobs[0].date.slice(3,10)+'</span><div class="bar-outer"><div class="bar-inner bar-lime" style="width:'+w+'%"></div></div><span class="bar-val">'+mc.pairs+' pairs</span></div>';
  });
  html+='</div>';

  html+='<div class="card"><div class="card-title">Revenue per month</div>';
  const maxRev=Math.max.apply(null,last6.map(function(m){return calcMonth(m.jobs).rev;}).concat([1]));
  last6.forEach(function(mo){
    const mc=calcMonth(mo.jobs);
    const w=Math.round(mc.rev/maxRev*100);

function addJob(){
  if(!selectedService){alert('Select a service first.');return;}
  const date=document.getElementById('j-date').value.trim();
  const name=document.getElementById('j-name').value.trim();
  if(!name||!date){alert('Name and date are required.');return;}
  const qty=+(document.getElementById('j-qty').value)||1;
  const svc=svcById(selectedService);
  const total=parseFloat(document.getElementById('j-total').value)||svc.price*qty;
  DATA.unshift({
    id:Date.now(),date,name,
    trainer:document.getElementById('j-trainer').value,
    service:selectedService,qty,total,
    paid:'Yes',
    status:document.getElementById('j-status').value,
    source:document.getElementById('j-source').value,
    notes:document.getElementById('j-notes').value
  });
  save();selectedService='';renderJobs();updateTopbar();
}

function delJob(id){
  if(!confirm('Delete this job?'))return;
  DATA=DATA.filter(function(j){return j.id!==id;});
  save();renderJobs();updateTopbar();
}

// ── MONTHLY REPORT ─────────────────────────────────────────────────────────
let reportMoIdx=-1;

function renderReport(){
  const el=document.getElementById('pg-report');
  const months=getMonthGroups();
  if(!months.length){el.innerHTML='<div style="text-align:center;padding:40px;color:var(--muted)">No jobs logged yet.</div>';return;}
  if(reportMoIdx<0)reportMoIdx=months.length-1;
  if(reportMoIdx>=months.length)reportMoIdx=months.length-1;

  const mo=months[reportMoIdx];
  const mc=calcMonth(mo.jobs);
  const mk=mo.jobs[0]?moKey(mo.jobs[0].date):'';
  const target=TARGETS[mk]||0;

  // Previous month comparison
  const prevMo=months[reportMoIdx-1];
  const prevMc=prevMo?calcMonth(prevMo.jobs):null;
  const pairsDiff=prevMc?mc.pairs-prevMc.pairs:null;
  const revDiff=prevMc?mc.rev-prevMc.rev:null;

  // Service breakdown
  const svcRows=SERVICES.map(function(svc){
    const count=mc.svcCount[svc.id]||0;
    return{svc,count,rev:count*svc.price};
  }).sort(function(a,b){return b.count-a.count;});

  // Source breakdown
  const srcCount={};
  mo.jobs.forEach(function(j){srcCount[j.source]=(srcCount[j.source]||0)+(+j.qty||1);});

  // Top trainers
  const trainerCount={};
  mo.jobs.forEach(function(j){if(j.trainer)trainerCount[j.trainer]=(trainerCount[j.trainer]||0)+(+j.qty||1);});
  const topTrainers=Object.entries(trainerCount).sort(function(a,b){return b[1]-a[1];}).slice(0,5);

  // Generate insights
  const insights=[];
  if(pairsDiff!==null){
    if(pairsDiff>0)insights.push({type:'good',text:'Pairs are up <strong>'+pairsDiff+' vs last month</strong> ('+prevMc.pairs+' → '+mc.pairs+'). Keep the momentum going.'});
    else if(pairsDiff<0)insights.push({type:'bad',text:'Pairs are down <strong>'+Math.abs(pairsDiff)+' vs last month</strong> ('+prevMc.pairs+' → '+mc.pairs+'). Push harder on Instagram DMs and ask for referrals from every job you complete.'});
    else insights.push({type:'',text:'Same number of pairs as last month. A consistent base — now push to grow it.'});
  }
  if(target>0){
    const gap=target-mc.pairs;
    if(gap>0)insights.push({type:'warn',text:'You\'re <strong>'+gap+' pairs short</strong> of your '+target+' pair target this month. To hit it, you need to be more aggressive with your follow-ups and posting frequency.'});
    else insights.push({type:'good',text:'Target hit — <strong>'+mc.pairs+' of '+target+' pairs</strong>. Consider raising the target next month.'});
  }
  const topSvcEntry=svcRows[0];
  if(topSvcEntry&&topSvcEntry.count>0)insights.push({type:'',text:'<strong>'+topSvcEntry.svc.name+'</strong> is your most popular service this month ('+topSvcEntry.count+' pairs). If you\'re not already upselling from Premium to Luxury, start — it\'s an extra £5 per pair.'});
  const instagramPairs=srcCount['Instagram']||0;
  if(instagramPairs>0){
    const instaPct=Math.round(instagramPairs/mc.pairs*100);
    if(instaPct>60)insights.push({type:'good',text:'<strong>'+instaPct+'% of pairs came from Instagram</strong>. Your content is working — double down on posting before/after transformations consistently.'});
    else insights.push({type:'warn',text:'Only <strong>'+instaPct+'% from Instagram</strong>. Your content should be generating more inbound. Post more transformation content — before/afters convert better than anything else.'});
  }
  if(mc.pending>0)insights.push({type:'warn',text:'<strong>£'+mc.pending.toLocaleString()+' still outstanding</strong> in unpaid jobs. Chase these this week — don\'t let payment collection slip.'});
  const referralPairs=srcCount['Referral']||0;
  if(referralPairs===0)insights.push({type:'warn',text:'Zero referrals logged this month. After every completed job, ask the customer — "do you have any friends with trainers that need cleaning?" A referral ask takes 10 seconds and costs nothing.'});
  else insights.push({type:'good',text:'<strong>'+referralPairs+' pairs from referrals</strong> this month. Referrals are free leads — keep asking every single customer.'});

  var html='';
  html+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">';
  html+='<div>';
  html+='<div style="font-size:10px;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px">Monthly wrap-up report</div>';
  html+='<div style="font-size:20px;font-weight:600">'+mk+'</div>';
  html+='</div>';
  html+='<div style="display:flex;gap:8px">';
  html+='<button class="btn-sm" onclick="reportMoIdx=Math.max(0,reportMoIdx-1);renderReport()">← Prev</button>';
  html+='<button class="btn-sm" onclick="reportMoIdx=Math.min(getMonthGroups().length-1,reportMoIdx+1);renderReport()">Next →</button>';
  html+='</div></div>';

  // Top stats
  html+='<div class="kpi-row">';
  html+='<div class="kpi accent"><div class="kpi-label">Pairs this month</div><div class="kpi-val lime">'+mc.pairs+'</div>';
  if(target>0)html+='<div class="kpi-sub">target: '+target+(mc.pairs>=target?' ✓':' ('+Math.round(mc.pairs/target*100)+'%)')+'</div>';
  html+='</div>';
  html+='<div class="kpi"><div class="kpi-label">Revenue</div><div class="kpi-val green">£'+mc.rev.toLocaleString()+'</div><div class="kpi-sub">'+mc.jobs+' jobs</div></div>';

  html+='</div>';

  // Service breakdown

  html+='<div class="card"><div class="card-title">Service breakdown</div>';

  Object.entries(srcCount).sort(function(a,b){return b[1]-a[1];}).forEach(function(entry){
    const w=Math.round(entry[1]/maxSrc*100);
    html+='<div class="bar-row"><span class="bar-lbl">'+entry[0]+'</span><div class="bar-outer"><div class="bar-inner bar-green" style="width:'+w+'%"></div></div><span class="bar-val">'+entry[1]+' pairs</span></div>';
  });
  html+='</div></div>';

  // All jobs this month
  html+='<div class="card"><div class="card-title">All jobs this month</div><div class="tbl-wrap"><table>';
  html+='<thead><tr><th>Date</th><th>Customer</th><th>Trainer</th><th>Service</th><th>Qty</th><th>Total</th><th>Source</th></tr></thead><tbody>';
  mo.jobs.slice().sort(function(a,b){return parseD(b.date)-parseD(a.date);}).forEach(function(j){
    const svc=svcById(j.service);
    html+='<tr class="dr">';
    html+='<td style="font-size:11px">'+fmtD(j.date)+'</td>';
    html+='<td style="font-weight:600">'+j.name+'</td>';
    html+='<td style="font-size:11px;color:var(--muted)">'+j.trainer+'</td>';
    html+='<td><span class="badge '+svc.color+'">'+svc.name+'</span></td>';
    html+='<td>'+j.qty+'</td>';
    html+='<td style="color:var(--accent);font-family:var(--mono)">£'+Number(j.total)+'</td>';
    html+='<td style="font-size:11px;color:var(--muted)">'+j.source+'</td>';
    html+='</tr>';
  });
  html+='</tbody></table></div></div>';

  // Insights
  html+='<div class="card"><div class="card-title">What to improve next month</div>';
  insights.forEach(function(ins){
    html+='<div class="insight'+(ins.type?' '+ins.type:'')+'" style="margin-bottom:8px">'+ins.text+'</div>';
  });
  html+='</div>';

  el.innerHTML=html;
}

render('dash');
</script>
</body>
</html>
